ci:
  autofix_prs: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-builtin-literals
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        args:
          - --allow-multiple-documents
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: detect-private-key
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 2834ec6639549dd6796205c8f011dedcd587288b  # frozen: v2.4.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-PyYAML
          - types-requests

  - repo: local
    hooks:
      - id: clj-kondo
        name: clj-kondo
        language: node
        additional_dependencies: [ "clj-kondo@2025.10.23" ]
        entry: clj-kondo
        args: [ "--lint", "frontend/src" ]
        types: [ clojure ]
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730  # frozen: v0.17.1
    hooks:
      # Run the linter.
      # Adding isort.known-first-party to sort src imports from other dirs
      # (backend/tests, files/) properly. Without it, `from src.* import ...`
      # is treated as a 3rd-party import and would be reordered wrong.
      # Relevant for ruff >= 0.17, where they added acheck for import ordering.
      - id: ruff
        args: ["--config", "lint.isort.known-first-party=['src']"]
      # Run the formatter.
      - id: ruff-format
